[project]
name = "pose-est"
version = "0.1.0"
description = "Calibration-based webcam posture feedback using MediaPipe"
readme = "README.md"
authors = [
    { name = "baobao", email = "aomusi.32trpro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.0.0",
    "numpy>=2.5.2",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=12.3.0",
]

[project.scripts]
pose-est = "pose_est:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
